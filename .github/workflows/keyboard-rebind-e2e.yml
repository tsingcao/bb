name: Keyboard rebind E2E

# scripts/keyboard-rebind-e2e.py 的 CI 化：对真实 dev 栈（e2e harness 种子 +
# built app）走一遍快捷键 rebind 全链路 —— Keyboard 设置页录制新组合 → 服务器
# keybindingOverrides 落库 → 新组合真实触发 sidebar.railToggle（旧默认失效）→
# 重载持久化 → Reset all 恢复默认、净零残留。这是唯一覆盖「录制 UI → 服务器
# 持久化 → 真实按键消费」整条链的自动化（vitest 单测只覆盖各层切片）。
#
# 平台语义：脚本按 navigator.platform 选修饰键（Mac=⌘，Linux CI=Ctrl），与
# domain 的 isMacKeyboardPlatform/matchesAppShortcut 同判据；默认绑定
# { mod: true, shift: true } 在两端都成立，无需按平台分 job。
#
# 触发：push（权威集成点，与 dshell-skin-snapshot 同分支集）+ PR paths（键盘
# 设置/命令系统/本脚本/本工作流时才跑，避免纯文档烧 10 分钟 dev 栈）+
# workflow_dispatch 手动。concurrency 组前缀独立（rebind-e2e-…），不与
# ci.yml/dshell-skin 互相取消。
#
# 失败诊断：--trace-dir 全程开 Playwright tracing，断言失败（exit 1）或环境
# 错误（exit 2）都会落盘 rebind-trace.zip（截图 + DOM 快照 + 源），上传为
# artifact 供 trace viewer 回放定位；后端日志一并上传。
on:
  push:
    branches: [main, nextloop/ide-base]
  pull_request:
    paths:
      - 'apps/app/src/components/settings/KeyboardSettingsSection.tsx'
      - 'apps/app/src/components/settings/KeyboardSettingsSection.test.tsx'
      - 'apps/app/src/components/commands/AppCommandProvider.tsx'
      - 'apps/app/src/lib/app-keybindings.ts'
      - 'apps/app/src/lib/keyboard-shortcut-settings.ts'
      - 'apps/server/src/services/system/app-keybindings.ts'
      - 'apps/server/src/routes/system.ts'
      - 'scripts/keyboard-rebind-e2e.py'
      - '.github/workflows/keyboard-rebind-e2e.yml'
  workflow_dispatch:

env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"
  PLAYWRIGHT_VERSION: "1.62.0"

concurrency:
  group: rebind-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keyboard-rebind-e2e:
    name: Keyboard rebind E2E (Playwright chromium, linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: rebind-e2e

      # 快照驱动的 app 由 e2e harness 以静态文件方式提供（BB_MOBILE_E2E_SERVE_APP=1
      # 读取 apps/app/dist），与 dshell-skin-snapshot 工作流同款：先 build 再起 harness。
      - name: Build the web app the rebind flow drives
        run: pnpm exec turbo run build --filter=@bb/app --output-logs=new-only

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "playwright==${{ env.PLAYWRIGHT_VERSION }}"

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright chromium
        run: python -m playwright install chromium --with-deps

      # e2e harness：fake provider + 固定种子项目/线程，serves built app；就绪时
      # 打印一行 JSON（serverUrl + threads.*）。turbo 会先构建其依赖。
      # `--log-order=stream` 保证就绪行不被 turbo 分组缓冲。
      - name: Start e2e backend (serves built app + seeds project/threads)
        env:
          BB_MOBILE_E2E_SERVE_APP: "1"
        run: |
          mkdir -p e2e-artifacts
          pnpm exec turbo run e2e:mobile-backend --filter=@bb/integration-tests \
            --output-logs=full --log-order=stream > e2e-artifacts/backend.log 2>&1 &
          echo $! > e2e-artifacts/backend.pid
          ready=0
          for _ in $(seq 1 120); do
            if grep -q '"serverUrl"' e2e-artifacts/backend.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat e2e-artifacts/backend.pid)" 2>/dev/null; then
              echo "backend exited early"; cat e2e-artifacts/backend.log; exit 1
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "backend did not become ready in time"; cat e2e-artifacts/backend.log; exit 1
          fi
          INFO="$(grep -m1 '"serverUrl"' e2e-artifacts/backend.log | sed -E 's/^.*(\{[^}]*"serverUrl"[^}]*\})/\1/')"
          echo "$INFO"
          echo "BB_URL=$(printf '%s' "$INFO" | python3 -c 'import json,sys; print(json.load(sys.stdin)["serverUrl"])')" >> "$GITHUB_ENV"

      # rebind 全链路：--trace-dir 开全程 tracing。Linux runner 上脚本自动选
      # Ctrl 修饰键（navigator.platform 非 Mac），断言标签用 "Shift"/"Ctrl+…"
      # 文案。脚本 finally 兜底 Reset all，服务器设置净零残留。
      - name: Run keyboard rebind E2E (record → apply → persist → reset)
        id: rebind
        env:
          BB_URL: ${{ env.BB_URL }}
        run: |
          mkdir -p e2e-artifacts/rebind-trace
          python3 scripts/keyboard-rebind-e2e.py \
            --url "$BB_URL" \
            --trace-dir e2e-artifacts/rebind-trace \
            2>&1 | tee e2e-artifacts/rebind.log
          exit "${PIPESTATUS[0]}"

      # 失败上传 trace（trace viewer 可回放：截图/DOM 快照/源）+ 运行日志。
      - name: Upload rebind trace + log (only on failure)
        if: failure() && steps.rebind.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: keyboard-rebind-trace-${{ github.run_id }}
          path: |
            e2e-artifacts/rebind-trace/rebind-trace.zip
            e2e-artifacts/rebind.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload harness backend log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: rebind-backend-${{ github.run_id }}
          path: e2e-artifacts/backend.log
          if-no-files-found: ignore
          retention-days: 7
