name: DShell skin snapshot

# dshell 皮肤层 headless Playwright 快照回归（scripts/dshell-skin-snapshot.py）。
#
# 数据封闭性：机器基线（docs/dshell-skin-shots/auto/）在 bb 的 e2e harness
# （tests/integration/mobile-e2e/backend.ts，fake provider + 固定种子项目/线程）下
# 生成并提交入库 —— 每次 CI 运行重铺同一份种子，数据指纹恒定，像素只随皮肤代码变化。
# 因此 --check 跑的是 --ci 场景集（home/settings/rail + glass_tab_info +
# glass_dark_terminal/glass_light_terminal + glass_anim，见脚本 CI_SCENES 注释）。
# 终端场景已纳入：harness 的 host daemon 能开真实终端（右面板 → Open new tab →
# Start terminal），脚本对会话做清理 + chrome 左/右子区比对，跨平台确定性成立；
# diff/sidechat 场景需要 changed files / 侧栏会话，CI 不跑。
#
# 基线生命周期：docs/dshell-skin-shots/auto 是提交入库的机器基线 —— 无 cache 也能
# 跑（checkout 自带）；这里仍做 restore/save cache，key 用基线内容 hash：
#   * 命中 = 与当前提交内容一致，无害；
#   * 显式 workflow_dispatch + refresh-dshell-baselines=true 时跑 --update 重拍，
#     刷新后的基线存进 cache 并上传 artifact，供人工审阅后提交。
# Playwright 浏览器另做独立 cache（key = playwright 版本），省去每次 ~150MB 下载。
#
# 触发：push（main / nextloop/ide-base 分支，权威集成点）+ PR + workflow_dispatch
# （可选重拍基线）。去重设计：
#   * push 不设 paths —— 任何提交到集成分支都过一遍皮肤闸（合并后的推送兜住 PR 期被
#     路径过滤跳过的改动；也是基线 cache 的存盘点）；
#   * pull_request 加 paths —— PR 期只跑与皮肤门直接相关的路径，纯文档/服务端等改动
#     不在 PR 上烧 30 分钟快照（合并后由 push 全量兜底）；
#   * job 级 merged dispatch —— PR head 是 tsingcao/bb 自己的 nextloop/ide-base 时
#     跳过（该提交已由 push 触发跑过），消除「同一提交 push+PR 双跑」；外部 fork /
#     其它 head 分支的 PR 仍照跑。
# 与 ci.yml 的 concurrency 组前缀不同（ci-… vs dshell-skin-…），两工作流互不取消；
# 同一提交在 push 到 main 时两工作流都会跑，那是不同闸（build/test vs 皮肤快照），
# 非重复。
on:
  push:
    branches: [main, nextloop/ide-base]
  pull_request:
    paths:
      - 'apps/app/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/dshell*'
      - 'scripts/check-dshell-*'
      - 'docs/dshell-skin-shots/**'
      - 'tests/integration/mobile-e2e/**'
      - '.github/workflows/dshell-skin-snapshot.yml'
  workflow_dispatch:
    inputs:
      refresh-dshell-baselines:
        description: 'Re-shoot the dshell skin machine baselines (--update; accepts current rendering)'
        required: false
        default: 'false'

env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"
  PLAYWRIGHT_VERSION: "1.62.0"

concurrency:
  group: dshell-skin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dshell-skin-snapshot:
    # merged dispatch：PR head 是 tsingcao/bb 自己的 nextloop/ide-base 时，同一提交
    # 已由 push 触发跑过（push 无 paths 过滤），PR 运行直接跳过，避免 push+PR 双跑。
    # 其余事件（push / dispatch / 外部 fork 或其它 head 分支的 PR）不受影响。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != 'tsingcao/bb' ||
      github.event.pull_request.head.ref != 'nextloop/ide-base'
    name: DShell skin snapshot (Playwright chromium)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dshell 令牌漂移闸（契约 §6 的 fork 侧镜像，scripts/check-dshell-drift.sh）：
      # bb 皮肤改动不得让主仓 Control Room 的 §2 锚点色漂移。主仓 CI 是从 fork raw
      # 取 bb CSS 验 CR 侧；这里反向 —— 浅克隆主仓（nextloop-net/nextloop，私有仓，
      # 需 NEXTLOOP_MAIN_PAT 读权限），断言其默认分支 HEAD 的 bb-fork 指针 == 本次
      # checkout 的 HEAD（镜像 bb_gitlink_gate：「先推 fork 再升指针」，未对齐红并给
      # 双向修复步骤），再从**同一提交**提取 dshell-cr.css 与 check_dshell_tokens.py
      # （脚本永远用主仓指针提交上的版本，fork 不 vendor 副本），对本次 dshell.css
      # 跑 ΔE 断言，任一锚点超阈值即红。PR 的 checkout 是合并提交、无法被主仓钉住，
      # 跳过指针检查只验 ΔE。未配置 NEXTLOOP_MAIN_PAT 时本闸休眠（::warning:: 提示，
      # 主仓侧 CI 仍强制漂移；配置后自动生效）。
      - name: DShell token drift gate (bb side vs Control Room at main's bb-fork pointer)
        if: secrets.NEXTLOOP_MAIN_PAT != ''
        env:
          NEXTLOOP_MAIN_TOKEN: ${{ secrets.NEXTLOOP_MAIN_PAT }}
          NEXTLOOP_MAIN_REPO: https://github.com/nextloop-net/nextloop.git
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/check-dshell-drift.sh --skip-pointer-check
          else
            bash scripts/check-dshell-drift.sh
          fi

      - name: DShell token drift gate — dormant (NEXTLOOP_MAIN_PAT not configured)
        if: secrets.NEXTLOOP_MAIN_PAT == ''
        run: |
          echo "::warning::DShell 令牌漂移闸休眠：未配置 NEXTLOOP_MAIN_PAT（需 nextloop-net/nextloop 读权限的 PAT）。主仓侧 CI 仍强制漂移；fork 侧镜像在配置后自动生效。"

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: dshell-skin

      # dshell 单元测试 gate：dshell lib（三态/迁移/性能护栏）+ 设置卡
      # （DshellAppearanceSetting/DshellMigrationBanner）+ sidebar rail
      # （sidebar/SidebarRailToggle/AppLayout rail）。与本地入口完全一致
      # （apps/app 的 test:dshell:unit 别名，同 ci.yml @bb/app 分片覆盖的文件）。
      # 跑在快照之前：单测红先于像素回归失败，便于定位。
      - name: Run dshell unit tests (lib + settings + sidebar rail)
        run: pnpm --filter=@bb/app run test:dshell:unit

      # 别名漂移守卫：test:dshell:unit 的文件清单必须与 ci.yml @bb/app 分片覆盖
      # （apps/app/src/**/*.test.{ts,tsx}）里的 dshell 契约范围完全一致——新增 dshell
      # 族测试而漏加进别名、或别名引了非契约/悬空文件都会在此红，防止快照 workflow
      # 与 ci.yml dshell-unit 分片静默丢套件（契约范围定义见脚本文件头）。
      # 同一闸还断言每个被引用的测试路径都存在于提交树（git ls-tree HEAD），防止
      # 别名引用未提交/未合入的文件（契约范围定义见脚本文件头）。
      - name: Guard dshell unit alias scope + commit-tree existence
        run: node scripts/check-dshell-unit-scope.mjs

      # 皮肤套件行覆盖率进 CI 可见层：test:dshell:unit 已带 --coverage
      # （reportsDirectory=apps/app/coverage/dshell-unit，text 进日志、lcov+html 归档）。
      # 单测失败也上传（if: always()），便于看失败前的覆盖率快照。
      - name: Upload dshell unit coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dshell-unit-coverage-${{ github.run_id }}
          path: apps/app/coverage/dshell-unit/**
          if-no-files-found: ignore

      # 快照驱动的 app 由 e2e harness 以静态文件方式提供（BB_MOBILE_E2E_SERVE_APP=1
      # 读取 apps/app/dist），与 mobile-e2e 工作流同款：先 build，再起 harness。
      - name: Build the web app the snapshot drives
        run: pnpm exec turbo run build --filter=@bb/app --output-logs=new-only

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install snapshot deps (playwright + Pillow, pinned)
        # 像素比对要求本地/CI 同一浏览器：playwright 版本与本地生成基线时一致
        # （1.62.0）；chromium 按该版本安装。
        run: |
          python -m pip install --upgrade pip
          pip install "playwright==${{ env.PLAYWRIGHT_VERSION }}" pillow

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright chromium
        run: python -m playwright install chromium --with-deps

      # 基线 cache：docs/dshell-skin-shots/auto 提交入库，restore 只是快路径；
      # 关键用途是 dispatch 重拍后把刷新基线持久化到 cache（key 随内容变化，
      # 永不覆盖更新的提交内容）。
      - name: Restore baseline cache
        id: baseline-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/dshell-skin-shots/auto
          key: dshell-auto-${{ hashFiles('docs/dshell-skin-shots/auto/**') }}

      # e2e harness：fake provider + 固定种子项目/线程，serves built app；就绪时
      # 打印一行 JSON（serverUrl + threads.*）。turbo 会先构建其依赖（plugin-sdk 等）。
      # `--log-order=stream` 保证持久任务的就绪行不被 turbo 分组缓冲。
      - name: Start e2e backend (serves built app + seeds project/threads)
        env:
          BB_MOBILE_E2E_SERVE_APP: "1"
        run: |
          mkdir -p e2e-artifacts
          pnpm exec turbo run e2e:mobile-backend --filter=@bb/integration-tests \
            --output-logs=full --log-order=stream > e2e-artifacts/backend.log 2>&1 &
          echo $! > e2e-artifacts/backend.pid
          ready=0
          for _ in $(seq 1 120); do
            if grep -q '"serverUrl"' e2e-artifacts/backend.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat e2e-artifacts/backend.pid)" 2>/dev/null; then
              echo "backend exited early"; cat e2e-artifacts/backend.log; exit 1
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "backend did not become ready in time"; cat e2e-artifacts/backend.log; exit 1
          fi
          # 解析就绪 JSON：serverUrl + 种子线程（rich 线程内容最全）
          INFO="$(grep -m1 '"serverUrl"' e2e-artifacts/backend.log | sed -E 's/^.*(\{[^}]*"serverUrl"[^}]*\})/\1/')"
          echo "$INFO"
          echo "BB_URL=$(printf '%s' "$INFO" | python3 -c 'import json,sys; print(json.load(sys.stdin)["serverUrl"])')" >> "$GITHUB_ENV"
          echo "BB_E2E_THREAD=/projects/$(printf '%s' "$INFO" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["projectId"] + "/threads/" + d["threads"]["rich"])')" >> "$GITHUB_ENV"

      # 默认 --check；dispatch 带 refresh-dshell-baselines=true 时改跑 --update 重拍。
      # --ci 只跑 harness 种子下确定性可验证的场景集（含终端玻璃场景）。
      - name: Run dshell skin snapshot (--check or --update)
        id: snapshot
        env:
          BB_URL: ${{ env.BB_URL }}
          BB_E2E_THREAD: ${{ env.BB_E2E_THREAD }}
        run: |
          if [ "${{ github.event.inputs.refresh-dshell-baselines || 'false' }}" == "true" ]; then
            echo "::notice::显式重拍 dshell 基线（refresh-dshell-baselines=true）—— 接受当前渲染为新基线"
            python3 scripts/dshell-skin-snapshot.py --update --ci
          else
            python3 scripts/dshell-skin-snapshot.py --check --ci
          fi

      # 故障注入自检（--inject-regression × 3）：对皮肤层三个契约逐一注入破坏性 CSS
      # （§11 毛玻璃摘除 / 过渡时长写死 / --ring 令牌摘除），跑对应探测器场景
      # （glass_anim 帧采样 ×2 + glass_tab_info 的 check_skin_identity），断言套件确实
      # 报红。这是回归套件自身的“测试”：若注入后仍全绿，说明探测器/选择器失效，
      # 后续真实回归会被静默吞掉。脚本在此模式下 exit 0=探测成功（自检通过）、
      # 1=未探测（harness 失效）、2=环境错误；任一模失败即 job 红并附具体条目。
      - name: Fault-injection self-check (--inject-regression × 3)
        env:
          BB_URL: ${{ env.BB_URL }}
          BB_E2E_THREAD: ${{ env.BB_E2E_THREAD }}
        run: |
          for mode in glass-removed duration-fixed ring-removed; do
            echo "::group::inject-regression=$mode"
            python3 scripts/dshell-skin-snapshot.py --inject-regression "$mode" \
              || { echo "::error::故障注入 $mode 未被套件探测（harness 失效）"; echo "::endgroup::"; exit 1; }
            echo "::endgroup::"
          done

      # 对比度审计（皮肤契约 §6 补缺）：同一 harness 实例 + playwright 安装，
      # 跑 8 个确定性主表面场景（home×2 / settings×2 / rail 三态 / migration
      # banner×2，见 scripts/dshell_contrast_audit.py SCENES）的 computed-style
      # WCAG 断言。像素快照管「形状回归」，这里管「玻璃化后文字可读」——
      # 弱化文本（secondary/muted）回归不再只靠肉眼。输出同时落盘供失败 artifact。
      # 元素覆盖快照：每场景 elements/failures 与仓库基线
      # docs/dshell-skin-shots/contrast-summary.json 对比（防覆盖率悄悄下滑 ——
      # SCENES 删场景/文本节点变少即红）；显式 dispatch 重拍时一并 --update-snapshot
      # 刷新基线。与本地同一入口：pnpm test:dshell:contrast（root package.json 别名，
      # BB_URL 透传；本地无 harness 时可 pnpm test:dshell:contrast --url <地址>）。
      - name: Run dshell contrast audit (WCAG text readability)
        id: contrast
        env:
          BB_URL: ${{ env.BB_URL }}
        run: |
          mkdir -p e2e-artifacts/contrast
          if [ "${{ github.event.inputs.refresh-dshell-baselines || 'false' }}" == "true" ]; then
            echo "::notice::显式重拍 dshell 对比度元素基线（refresh-dshell-baselines=true）"
            pnpm test:dshell:contrast --update-snapshot 2>&1 | tee e2e-artifacts/contrast/report.txt
          else
            pnpm test:dshell:contrast 2>&1 | tee e2e-artifacts/contrast/report.txt
          fi
          exit "${PIPESTATUS[0]}"

      - name: Upload contrast audit report (only on failure)
        if: failure() && steps.contrast.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dshell-contrast-report-${{ github.run_id }}
          path: e2e-artifacts/contrast/report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload .diff report (only on check regression)
        # --check 失败（rc1）时脚本把 双图并排+差异热区 写入 auto/.diff/；上传供人工定位。
        # --update 模式不产生 .diff（if-no-files-found: ignore 兜底）。
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dshell-skin-diff-${{ github.run_id }}
          path: docs/dshell-skin-shots/auto/.diff/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload refreshed baselines (on explicit --update)
        # dispatch 重拍产物：下载后人工审阅并提交（与基线提交纪律一致）。
        # 含对比度元素基线 JSON（contrast-summary.json，同次重拍产物）。
        if: github.event.inputs.refresh-dshell-baselines == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dshell-baselines-updated-${{ github.run_id }}
          path: |
            docs/dshell-skin-shots/auto/*.png
            docs/dshell-skin-shots/contrast-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save baseline cache (pass or explicit refresh)
        # 只在绿 / 显式重拍时存 —— 红的运行绝不把失败截图存成新基线。
        # key 用 hashFiles：基线内容变则 key 变，不会用旧缓存掩盖新提交。
        if: success() || github.event.inputs.refresh-dshell-baselines == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/dshell-skin-shots/auto
          key: dshell-auto-${{ hashFiles('docs/dshell-skin-shots/auto/**') }}

      - name: Upload harness backend log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dshell-skin-backend-${{ github.run_id }}
          path: e2e-artifacts/backend.log
          if-no-files-found: ignore
          retention-days: 7